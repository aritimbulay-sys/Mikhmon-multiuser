services:
  mikhmon:
    image: animegasan/mikhmon:v3-latest
    container_name: mikhmon
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/var/www/html
      - ./include:/var/www/html/include
    environment:
      - TZ=Asia/Jakarta
